<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#779777">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Moss &amp; Bell</title>
<!--MANIFEST-->
<!--ICON-->
<style>
  :root { color-scheme: light; --paper: #F2E4C8; --ink: #4A3B2C; --moss: #779777; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: ui-rounded, "Nunito", system-ui, sans-serif; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .chip { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: calc(env(safe-area-inset-left) + 12px);
    background: rgba(242,228,200,.85); border-radius: 999px; padding: 8px 14px; font-size: 14px; }
  #chip { top: auto; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translateX(-50%); white-space: nowrap; }
  #chip:empty { display: none; }
  .satchel { display: flex; gap: 10px; align-items: center; transition: opacity .4s, transform .15s; }
  .satchel.empty { opacity: 0; }
  .satchel.bump { transform: scale(1.08); }
  .item { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .item[hidden] { display: none; }
  .item svg { width: 22px; height: 22px; }
  .item.full b { color: #8a5a2c; }
  .cost { position: absolute; transform: translate(-50%, -100%); background: rgba(242,228,200,.9); border-radius: 14px;
    padding: 6px 12px; font-size: 13px; text-align: center; transition: opacity .3s; opacity: 0; white-space: nowrap; }
  .cost.show { opacity: 1; }
  .cost .name { font-size: 12px; opacity: .75; margin-bottom: 2px; }
  #intro { position: absolute; left: 0; right: 0; top: 32%; text-align: center; font-size: 22px; font-style: italic;
    color: #fffaf0; text-shadow: 0 1px 8px rgba(74,59,44,.6); opacity: 0; transition: opacity 2.5s; padding: 0 24px; }
  #intro.show { opacity: 1; }
  .words { position: absolute; left: 50%; top: calc(env(safe-area-inset-top) + 64px); transform: translateX(-50%) translateY(6px);
    background: rgba(246,238,220,.94); border-radius: 18px; padding: 16px 26px 14px; max-width: min(520px, 80vw);
    box-shadow: 0 6px 24px rgba(74,59,44,.25); opacity: 0; transition: opacity .6s, transform .6s; text-align: center;
    font-size: 17px; line-height: 1.55; }
  .words.show { opacity: 1; transform: translateX(-50%); }
  .words.poem #words-lines { font-style: italic; font-size: 19px; }
  .words .from { font-size: 13px; opacity: .7; margin-top: 8px; }
  .words .from:empty { display: none; }
  .words .tag { font: 10px ui-monospace, monospace; letter-spacing: .12em; opacity: .45; margin-top: 8px; }
  .words .tag[hidden] { display: none; }
  #menu .note { font-size: 12px; opacity: .7; margin: 14px 0 0; max-width: 300px; }
  .corner { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: calc(env(safe-area-inset-right) + 12px);
    pointer-events: auto; min-width: 48px; min-height: 48px; border: 0; border-radius: 16px;
    background: rgba(242,228,200,.85); color: var(--ink); font-size: 20px; }
  .context { position: absolute; right: calc(env(safe-area-inset-right) + 28px); bottom: calc(env(safe-area-inset-bottom) + 28px);
    pointer-events: auto; min-width: 88px; min-height: 88px; border-radius: 50%; border: 0;
    background: rgba(119,151,119,.9); color: #fff; font-size: 16px; font-weight: 700; display: none; }
  .context.show { display: block; }
  .stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    background: rgba(242,228,200,.35); border: 2px solid rgba(132,107,80,.4); display: none; }
  .stick.show { display: block; }
  .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(132,107,80,.55); }
  #debug { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 8px); left: calc(env(safe-area-inset-left) + 12px);
    font: 11px ui-monospace, monospace; opacity: .6; }
  #menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(74,59,44,.35); }
  #menu.show { display: flex; }
  #menu .panel { background: var(--paper); border-radius: 20px; padding: 20px 24px; min-width: 260px; max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  #menu label.range { align-items: center; }
  #menu label.range input { flex: 1; min-height: 44px; }
  #menu label.range span { font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
  #menu .note { margin: 0 0 6px; }
  #menu label { display: flex; justify-content: space-between; gap: 12px; margin: 10px 0; }
  #menu select, #menu button { min-height: 44px; font: inherit; }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    background: var(--paper); font-size: 20px; padding: 24px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  /* Phase 4: travel. A paper-coloured fade between places, and the painted travel map. */
  #fade { position: fixed; inset: 0; background: var(--paper); opacity: 0; pointer-events: none; transition: opacity .75s; }
  #fade.show { opacity: 1; }
  .travel { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(74,59,44,.35); }
  .travel.show { display: flex; }
  .travel .sheet { position: relative; width: min(720px, calc(100vw - 32px)); aspect-ratio: 100 / 60; max-height: calc(100vh - 40px);
    background: #f2e4c8; border-radius: 18px; box-shadow: 0 10px 40px rgba(74,59,44,.35); overflow: hidden; }
  .travel svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .travel .pins { position: absolute; inset: 0; }
  .travel .pin { position: absolute; transform: translate(-50%, -50%); min-width: 48px; min-height: 48px; border: 0; background: none;
    display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); font: inherit; cursor: pointer; pointer-events: auto; }
  .travel .pin .dot { width: 20px; height: 20px; border-radius: 50%; background: #846b50; border: 3px solid #f6eedc; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .travel .pin .name { font-weight: 700; font-size: 15px; background: rgba(246,238,220,.85); border-radius: 10px; padding: 2px 8px; }
  .travel .pin.here { cursor: default; }
  .travel .pin.here .dot { background: #c04a3a; }
  .travel .pin.pick .name { outline: 2px solid #779777; }
  .travel .here-tag { font-size: 11px; opacity: .7; }
  .travel .close { position: absolute; top: 10px; right: 10px; min-width: 48px; min-height: 48px; border: 0; border-radius: 14px;
    background: rgba(246,238,220,.9); font-size: 18px; color: var(--ink); }
  .travel .hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; opacity: .6; }
  /* Phase 5: the collection book, decorating, the find card. */
  .corner.b2 { right: calc(env(safe-area-inset-right) + 70px); font-size: 18px; }
  .corner.b3 { right: calc(env(safe-area-inset-right) + 128px); font-size: 18px; }
  .corner[hidden] { display: none; }
  body.decorating #decor-btn { background: rgba(119,151,119,.9); color: #fff; }
  .find-pic { width: 96px; height: 96px; display: block; margin: 0 auto; }
  .find-season { font-size: 22px; opacity: .75; margin-top: 2px; }
  .tray { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 54px); display: none;
    gap: 6px; padding: 6px; border-radius: 18px; background: rgba(242,228,200,.88); pointer-events: auto; max-width: calc(100vw - 220px); overflow-x: auto; touch-action: pan-x; }
  body.decorating .tray { display: flex; }
  .tray .deco { flex: 0 0 auto; width: 56px; height: 56px; border: 0; border-radius: 14px; background: rgba(255,250,240,.7); padding: 2px; }
  .tray .deco img { width: 100%; height: 100%; }
  .tray .deco.pick { outline: 3px solid #779777; background: #fffaf0; }
  .tray .deco.done { font-size: 22px; color: var(--ink); background: rgba(119,151,119,.35); }
  .rot { position: absolute; right: calc(env(safe-area-inset-right) + 130px); bottom: calc(env(safe-area-inset-bottom) + 40px); min-width: 64px; min-height: 64px;
    border-radius: 50%; border: 0; background: rgba(242,228,200,.9); color: var(--ink); font-size: 26px; pointer-events: auto; }
  .rot[hidden] { display: none; }
  .book { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(74,59,44,.35); }
  .book.show { display: flex; }
  .book .sheet { position: relative; width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box;
    background: #f6eedc; border-radius: 18px; box-shadow: 0 10px 40px rgba(74,59,44,.35); padding: 18px 22px; touch-action: pan-y; }
  .book h3 { margin: 6px 0 8px; font-size: 20px; text-align: center; opacity: .55; font-weight: 400; }
  .book .pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; position: static; transform: none; opacity: 1;
    background: none; box-shadow: none; padding: 0; max-width: none; text-align: left; font-size: 12px; line-height: 1.4; }
  .book .page { background: #fffaf0; border-radius: 10px; padding: 8px 10px; min-height: 48px; box-shadow: 0 1px 3px rgba(74,59,44,.12); }
  .book .page.poem { font-style: italic; }
  .book .page .from { opacity: .6; margin-top: 4px; font-style: normal; }
  .book .page.blank { background: rgba(255,250,240,.35); box-shadow: inset 0 0 0 1px rgba(132,107,80,.15); }
  .book .friends { display: flex; gap: 14px; justify-content: center; }
  .book .friend { width: 84px; height: 64px; color: #846b50; }
  .book .friend.blank { color: rgba(132,107,80,.15); }
  .book .seasons { display: grid; grid-template-columns: auto repeat(4, 1fr); gap: 6px; align-items: center; }
  .book .seasons .glyph { text-align: center; font-size: 22px; opacity: .55; }
  .book .seasons .glyph.now { opacity: 1; }
  .book .seasons .place { font-size: 13px; opacity: .7; padding-right: 6px; }
  .book .seasons .cell { display: flex; justify-content: center; min-height: 64px; background: rgba(255,250,240,.5); border-radius: 10px; }
  .book .seasons img { width: 64px; height: 64px; }
  .book .seasons img.missing { filter: brightness(0); opacity: .12; }
  .book .close { position: absolute; top: 10px; right: 10px; min-width: 48px; min-height: 48px; border: 0; border-radius: 14px;
    background: rgba(242,228,200,.9); font-size: 18px; color: var(--ink); }
  #boot-error { position: fixed; inset: 0; display: none; padding: 24px; background: var(--paper); white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="chip satchel empty" id="satchel" aria-label="Carrying">
    <span class="item" id="carry-wood" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="8" width="18" height="9" rx="4.5" fill="#a48a62"/><ellipse cx="19" cy="12.5" rx="3.2" ry="4.5" fill="#d9c39d" stroke="#846b50"/><circle cx="19" cy="12.5" r="1.4" fill="none" stroke="#846b50"/></svg><b>0</b></span>
    <span class="item" id="carry-bamboo" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="5" height="20" rx="2" fill="#9aae5c" stroke="#5f7238"/><rect x="13" y="5" width="5" height="17" rx="2" fill="#b8c070" stroke="#5f7238"/><path d="M5 9h5M5 15h5M13 11h5M13 17h5" stroke="#5f7238"/></svg><b>0</b></span>
    <span class="item" id="carry-stone" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17c-1-4 2-9 7-10s9 2 9 6-3 6-8 6-7 0-8-2z" fill="#9d9c8b" stroke="#6c6a68"/><path d="M8 11c2-1 4-1 5 0" stroke="#c9c6ba" fill="none"/></svg><b>0</b></span>
  </div>
  <div class="chip" id="chip"></div>
  <div class="cost" id="cost"><div class="name" id="cost-name"></div><div id="cost-items"></div></div>
  <div id="intro"></div>
  <div class="words" id="words" aria-live="polite"><div id="words-lines"></div><div class="from" id="words-from"></div><div class="tag" id="words-tag">PLACEHOLDER</div></div>
  <button class="corner" id="menu-btn" aria-label="Menu">☰</button>
  <button class="corner b2" id="book-btn" aria-label="Collection book"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6v14" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button class="corner b3" id="decor-btn" aria-label="Decorate" hidden><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 21v-7M12 14c-4 0-6-3-6-6 3 0 6 2 6 6zM12 14c4 0 6-3 6-7-3 0-6 3-6 7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 21h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <div class="tray" id="decor-tray"></div>
  <button class="rot" id="decor-rot" aria-label="Turn" hidden>⟳</button>
  <button class="context" id="context-btn">Sit</button>
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <div id="debug"></div>
</div>
<div id="menu" role="dialog" aria-label="Settings">
  <div class="panel">
    <h2 style="margin:0 0 8px">Settings</h2>
    <label>Quality <select id="quality"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="ultra">Ultra</option></select></label>
    <label>Sound <select id="sound"><option value="on">On</option><option value="off">Off</option></select></label>
    <div id="art-trial" hidden>
      <h3 style="margin:14px 0 4px;font-size:15px">Art trial (decided; shown with ?trial)</h3>
      <label>Look <select id="look"></select></label>
      <p class="note" id="look-note"></p>
      <label>Caretaker <select id="character"></select></label>
      <label>Building kit <select id="kit"></select></label>
    </div>
    <label>Season <select id="season-mode"></select></label>
    <p class="note">Now: <span id="season-now"></span></p>
    <label>Hemisphere <select id="hemisphere"><option value="north">Northern</option><option value="south">Southern</option></select></label>
    <label>Season palette <select id="palette"></select></label>
    <p class="note"><span id="palette-note"></span> (A7 trial: not decided yet)</p>
    <label>Time <select id="time-mode"><option value="clock">Follow my clock</option><option value="day">Always day</option><option value="fixed">Choose</option></select></label>
    <label class="range"><input type="range" id="time-at" min="0" max="999" step="1"><span id="time-label"></span></label>
    <button id="menu-close">Close</button>
  </div>
</div>
<div class="travel" id="travel" role="dialog" aria-label="Travel map">
  <div class="sheet">
    <svg viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true">
      <!-- A painted map: hills in washes of green, a river, the trail between known places (dotted). -->
      <path d="M4 50 C 14 36, 22 30, 34 30 S 52 40, 60 30 S 80 8, 96 12 L 96 56 L 4 56 Z" fill="#cfd9a8" opacity=".7"/>
      <path d="M8 44 C 18 34, 28 33, 36 36 S 48 46, 40 52 S 14 56, 8 44 Z" fill="#a9c47e" opacity=".85"/>
      <path d="M60 16 C 68 8, 82 8, 88 16 S 84 32, 74 30 S 54 26, 60 16 Z" fill="#7ea86a" opacity=".85"/>
      <path d="M2 24 C 20 20, 30 12, 46 14 S 70 4, 98 6" stroke="#9cc7b8" stroke-width="1.6" fill="none" opacity=".8"/>
      <ellipse cx="26" cy="42" rx="3" ry="1.8" fill="#9cc7b8"/>
      <path id="travel-trail" d="" stroke="#846b50" stroke-width=".9" stroke-dasharray="1.6 1.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="pins" id="travel-pins"></div>
    <button class="close" id="travel-close" aria-label="Close map">✕</button>
    <div class="hint">Choose a place to travel there</div>
  </div>
</div>
<div class="book" id="book" role="dialog" aria-label="Collection book">
  <div class="sheet">
    <div class="seasons" id="book-seasons"></div>
    <h3>♡</h3>
    <div class="friends" id="book-friends"></div>
    <h3>✎</h3>
    <div class="pages" id="book-words"></div>
    <button class="close" id="book-close" aria-label="Close book">✕</button>
  </div>
</div>
<div id="fade"></div>
<div id="rotate">Turn your phone sideways to play.</div>
<div id="boot-error"></div>
<script>/*BUNDLE*/</script>
</body>
</html>
